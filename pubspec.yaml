name: chatapp
description: Simple Messenger-style chat app (Flutter + Firebase).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

# firebase_core, firebase_auth and cloud_firestore are added by the
# GitHub Actions workflow (flutter pub add) so you always get current versions.
dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
